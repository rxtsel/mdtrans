[package]
name = "mdtrans"
version = "0.1.0"
edition = "2024"
description = "Minimal AI-powered Markdown translation CLI"

[dependencies]
anyhow = "1"
# Keep parsing, help, and suggestions without the optional color dependency stack.
clap = { version = "4.6.1", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
dirs = "6"
indicatif = { version = "0.18", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
toml = "0.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
